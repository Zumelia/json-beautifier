<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>JSON <b>Beautifier</b></h1>
    <p class="tag">Local · open-source · no ads, no telemetry</p>

    <label class="row">
      <span>Theme</span>
      <select id="theme">
        <option value="auto">Auto (system)</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>

    <label class="row">
      <span>Indent</span>
      <select id="indent">
        <option value="2">2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="1">1 space</option>
      </select>
    </label>

    <label class="row">
      <span>Auto-expand depth</span>
      <select id="expandDepth">
        <option value="1">1 level</option>
        <option value="2">2 levels</option>
        <option value="3">3 levels</option>
        <option value="0">Collapsed</option>
      </select>
    </label>

    <label class="row">
      <span>Sort object keys</span>
      <input type="checkbox" id="sortKeys" />
    </label>

    <label class="row">
      <span>Line numbers</span>
      <input type="checkbox" id="lineNumbers" />
    </label>

    <!-- Ссылки из очереди запуска. Donate пока нет — страницы не существует,
         а вести в никуда хуже, чем не вести вовсе. Rate us ведёт прямо в стор;
         когда на сайте появится /rate/, переключим на него. -->
    <p class="links">
      <a href="https://jsonbeautifier.dev/?utm_source=extension&amp;utm_medium=popup&amp;utm_campaign=website"
         target="_blank" rel="noopener">Website</a>
      <a href="https://chromewebstore.google.com/detail/mpeomjgcmddedcglokpmeideoelaidbn/reviews"
         target="_blank" rel="noopener">Rate us</a>
      <a href="https://github.com/Zumelia/json-beautifier"
         target="_blank" rel="noopener">Source</a>
    </p>

    <p class="foot">Changes apply immediately to open JSON tabs.</p>

    <script src="popup.js"></script>
  </body>
</html>
